<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FUTDJM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0908">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUTDJM">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#b5922e; --gold-light:#e8c565; --gold-deep:#6e5717; --red:#93202b; --red-light:#cf7982; --red-deep:#4a0d13; --ink:#0a0908; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--ink);color:#f3ede0;font-family:'Inter',sans-serif;}
body{min-height:100vh;background:radial-gradient(ellipse 90% 40% at 50% 0%, rgba(232,197,101,.12), transparent 60%),repeating-linear-gradient(115deg, rgba(232,197,101,.02) 0 1px, transparent 1px 46px),linear-gradient(175deg,#141109,#0a0908 60%);}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding:22px 16px 40px;display:flex;flex-direction:column;}

.eyebrow{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-light);text-align:center;font-weight:700;opacity:.85;}
h1{font-family:'Playfair Display',serif;text-align:center;font-size:22px;margin:4px 0 0;font-weight:800;color:#f5f1e4;}
h1 em{font-style:normal;background:linear-gradient(180deg,var(--gold-light),var(--gold) 55%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}
.gold-rule{width:50px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px auto 20px;}
.hint{text-align:center;color:#a89a76;font-size:11.5px;max-width:340px;margin:0 auto 20px;line-height:1.5;}
.back-btn{background:none;border:none;color:#a89a76;font-size:12px;letter-spacing:.5px;display:flex;align-items:center;gap:5px;padding:4px 0;margin-bottom:8px;cursor:pointer;font-family:'Inter';}

/* ===== HOME SCREEN ===== */
header{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
.crest-badge{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.4), 0 0 0 3px var(--gold-light), 0 4px 10px rgba(0,0,0,.5);}
.crest-badge img{width:100%;height:100%;object-fit:cover;display:block;}
.wordmark{font-family:'Anton',sans-serif;font-size:23px;letter-spacing:1px;line-height:1;}
.wordmark span{background:linear-gradient(180deg,var(--gold-light),var(--gold) 60%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}
.tagline{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a89a76;margin-top:2px;}

.btn-hero{
  position:relative;overflow:hidden;border:1px solid rgba(232,197,101,.4);border-radius:16px;
  background:linear-gradient(135deg,#22190f,#0a0908 70%);
  padding:20px 18px;margin-bottom:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  text-align:left;font-family:inherit;width:100%;
  box-shadow:0 10px 26px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .16s ease, box-shadow .16s ease;
}
.btn-hero::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 90% at 100% 0%, rgba(232,197,101,.26), transparent 60%);}
.btn-hero::after{content:'';position:absolute;top:0;bottom:0;width:60%;left:-70%;pointer-events:none;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.09) 45%, transparent 60%);
  animation:heroShine 5s ease-in-out infinite;}
@keyframes heroShine{0%,60%{left:-70%;}100%{left:130%;}}
.btn-hero:active{transform:scale(.985);box-shadow:0 4px 14px rgba(0,0,0,.5);}
.hero-label{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-light);font-weight:700;opacity:.85;}
.hero-title{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:.5px;line-height:1.05;margin:4px 0 4px;color:#fff;}
.hero-sub{font-size:12px;color:#b8ac8e;max-width:170px;line-height:1.4;}
.hero-arrow{width:34px;height:34px;border-radius:50%;flex:none;background:linear-gradient(180deg,var(--gold-light),var(--gold));display:flex;align-items:center;justify-content:center;color:#1c1600;font-size:18px;font-weight:800;position:relative;z-index:2;}
.admin-link{text-align:center;font-size:10px;color:#5c5340;margin-top:14px;cursor:pointer;text-decoration:underline;letter-spacing:.5px;}

/* ===== ADD PLAYER FORM ===== */
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#a89a76;font-weight:700;margin-bottom:6px;}
.form-field input[type=text],.form-field input[type=number],.form-field select{
  width:100%;padding:11px 12px;border-radius:8px;border:1px solid rgba(232,197,101,.25);
  background:#171209;color:#f3ede0;font-family:'Inter';font-size:14px;
}
.form-field input[type=file]{width:100%;color:#a89a76;font-size:12px;}
.chk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.chk-row{display:flex;align-items:center;gap:6px;font-size:12px;color:#d8cdb2;background:#171209;border:1px solid rgba(232,197,101,.2);border-radius:8px;padding:8px;}
.admin-link-btn{display:block;width:100%;margin-top:14px;padding:10px;background:none;border:1px solid rgba(232,197,101,.25);border-radius:8px;color:#a89a76;font-family:'Inter';font-size:12px;cursor:pointer;}
.edit-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid rgba(232,197,101,.18);background:#171209;margin-bottom:8px;cursor:pointer;}
.edit-row .fc-outer{width:44px;flex:none;}
.edit-row .info{flex:1;}
.edit-row .name{font-family:'Playfair Display',serif;font-weight:700;font-size:13px;color:#f0e6cc;}
.edit-row .meta{font-size:10.5px;color:#a89a76;margin-top:2px;}
.danger-btn{width:100%;padding:11px;margin-top:10px;border-radius:8px;border:1px solid rgba(207,121,130,.4);background:transparent;color:var(--red-light);font-family:'Inter';font-weight:600;font-size:13px;cursor:pointer;}
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 6px;justify-items:center;margin-top:6px;}
.draft-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid rgba(232,197,101,.18);background:#171209;margin-bottom:8px;}
.draft-row .fc-outer{width:52px;flex:none;}
.draft-row .info{flex:1;}
.draft-row .name{font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.5px;color:#f0e6cc;}
.draft-row .meta{font-size:10.5px;color:#a89a76;margin-top:2px;}
.draft-row-actions{display:flex;flex-direction:column;gap:6px;}
.redraft-btn.danger{border-color:rgba(207,121,130,.4);color:var(--red-light);}

/* ===== MONEDAS / PACKS / TIENDA / MI EQUIPO ===== */
.coin-badge{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#221a0c,#0a0908);border:1px solid rgba(232,197,101,.35);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--gold-light);margin-bottom:16px;}
.coin-icon{width:20px;height:20px;border-radius:50%;overflow:hidden;display:inline-block;border:1.5px solid var(--gold-light);box-shadow:0 0 6px rgba(232,197,101,.5);flex:none;}
.coin-icon img{width:100%;height:100%;object-fit:cover;display:block;}

.pack-stage{position:relative;min-height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;border-radius:18px;overflow:hidden;padding:30px 0;
  background:radial-gradient(60% 50% at 50% 40%, rgba(232,197,101,.07), transparent 70%);}
.pack-special-bg{background:radial-gradient(70% 60% at 50% 38%, rgba(40,30,10,.5), #000 78%);}

/* ---- sobre (más grande, diseño elaborado tipo carta metalizada) ---- */
.pack-card{
  width:min(240px,64vw); aspect-ratio:0.72; border-radius:20px; cursor:pointer; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  border:3px solid rgba(255,255,255,.65);
  box-shadow:0 26px 54px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -36px 46px rgba(0,0,0,.28);
  overflow:hidden; transform-style:preserve-3d;
}
.pack-card-pattern{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 3px, transparent 3px 20px);
  mix-blend-mode:overlay; opacity:.7;}
.pack-card-vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,.35), transparent 55%), linear-gradient(0deg, rgba(0,0,0,.35), transparent 35%);}
.pack-card-shine{position:absolute;top:-50%;bottom:-50%;width:40%;left:-65%;pointer-events:none;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.6) 45%, transparent 62%);
  transform:rotate(14deg); animation:packShine 3.6s ease-in-out infinite;}
@keyframes packShine{ 0%,55%{left:-65%;} 100%{left:145%;} }
.pack-emblem{width:25%;aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;z-index:2;
  border:3px solid rgba(255,255,255,.9);box-shadow:0 8px 18px rgba(0,0,0,.45), 0 0 0 6px rgba(0,0,0,.15);background:#111;}
.pack-emblem img{width:100%;height:100%;object-fit:cover;display:block;}
.pack-name{font-family:'Anton',sans-serif;letter-spacing:1.5px;font-size:17px;text-transform:uppercase;text-align:center;
  padding:0 16px;position:relative;z-index:2;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55);}
.pack-sub{font-size:9.5px;letter-spacing:2.5px;text-transform:uppercase;color:#fff;opacity:.8;position:relative;z-index:2;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5);}
.pack-corner{position:absolute;width:24px;height:24px;border:2px solid rgba(255,255,255,.6);opacity:.85;z-index:2;}
.pack-corner.tl{top:12px;left:12px;border-right:none;border-bottom:none;border-radius:7px 0 0 0;}
.pack-corner.tr{top:12px;right:12px;border-left:none;border-bottom:none;border-radius:0 7px 0 0;}
.pack-corner.bl{bottom:12px;left:12px;border-right:none;border-top:none;border-radius:0 0 0 7px;}
.pack-corner.br{bottom:12px;right:12px;border-left:none;border-top:none;border-radius:0 0 7px 0;}
.pack-card.spinning{animation:packSpin .85s ease-in-out;}
.pack-card.spinning.slow{animation:packSpin 1.7s cubic-bezier(.3,.1,.3,1);}
@keyframes packSpin{ from{transform:rotateY(0deg);} to{transform:rotateY(1080deg);} }

/* ---- revelado (cartas más grandes al verlas) ---- */
.pack-stage .card-wrap{transform:scale(1.55);margin:26px 0;}
.pack-stage .opt-row{gap:26px;margin-top:10px;}
.pack-stage .opt-row .card-wrap{transform:scale(1.15);margin:14px 0;}

.buildup-rating{font-family:'Anton',sans-serif;font-size:84px;color:#fff;text-shadow:0 0 36px rgba(232,197,101,.85), 0 0 70px rgba(232,197,101,.4);position:relative;z-index:2;}
.buildup-rays{position:absolute;inset:-30%;background:conic-gradient(from 0deg, transparent, rgba(232,197,101,.45), transparent 30%, rgba(232,197,101,.45) 50%, transparent 70%, rgba(232,197,101,.45) 90%, transparent);animation:raySpin 3s linear infinite;opacity:.9;}
@keyframes raySpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.reveal-pop{animation:revealPop .55s cubic-bezier(.2,.9,.3,1.3);}
@keyframes revealPop{ from{transform:scale(.5) rotateY(90deg); opacity:0;} to{transform:scale(1.55) rotateY(0deg); opacity:1;} }
.confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.confetti-piece{position:absolute;top:-20px;width:9px;height:16px;opacity:.9;animation-name:confettiFall;animation-timing-function:ease-in;animation-iteration-count:1;border-radius:2px;}
@keyframes confettiFall{ from{transform:translateY(-20px) rotate(0deg); opacity:1;} to{transform:translateY(520px) rotate(540deg); opacity:0;} }

/* ---- temas de color (mismo hue de cada pack, gradiente más elaborado) ---- */
.theme-mono{background:linear-gradient(150deg,#f7f7f7 0%,#cfcfcf 20%,#8f8f8f 48%,#4a4a4a 74%,#181818 100%);}
.theme-bronze{background:linear-gradient(150deg,#f4c98c 0%,#d99a5c 20%,#a5642a 48%,#6b3a14 74%,#2a1608 100%);}
.theme-teal{background:linear-gradient(150deg,#aef4ff 0%,#6be3f2 20%,#1c93ab 48%,#0e4a55 74%,#031c20 100%);}
.theme-purple{background:linear-gradient(150deg,#ecdcff 0%,#c9a3ff 20%,#8a5ae0 48%,#4a2a80 74%,#1a0d38 100%);}
.theme-blue{background:linear-gradient(150deg,#cfe6ff 0%,#7db8ff 20%,#3a72c9 48%,#1c3d7a 74%,#0a1a38 100%);}
.theme-gold{background:linear-gradient(150deg,#fffbe8 0%,#ffe9a0 16%,#e8c565 40%,#b5922e 66%,#6e5717 88%,#2a1e08 100%);}

.store-pack{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid rgba(232,197,101,.2);background:#171209;margin-bottom:10px;}
.store-pack-visual{width:60px;height:84px;border-radius:9px;flex:none;position:relative;overflow:hidden;
  box-shadow:0 8px 16px rgba(0,0,0,.45); border:1.5px solid rgba(255,255,255,.4);}
.store-pack-visual::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg, rgba(255,255,255,.14) 0 2px, transparent 2px 12px);mix-blend-mode:overlay;opacity:.7;}
.store-pack-visual::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.3), transparent 55%);}
.store-pack-info{flex:1;}
.store-pack-name{font-family:'Anton',sans-serif;font-size:13.5px;letter-spacing:.5px;color:#f0e6cc;}
.store-pack-price{font-size:12px;color:var(--gold-light);margin-top:2px;font-weight:700;}

.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.tab-row{display:flex;gap:8px;margin-bottom:18px;}
.tab-btn{flex:1;padding:10px;border-radius:9px;border:1px solid rgba(232,197,101,.25);background:#171209;color:#a89a76;font-family:'Anton',sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;}
.tab-btn.active{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1c1600;border-color:transparent;}
.filter-pill{padding:6px 12px;border-radius:20px;border:1px solid rgba(232,197,101,.25);background:#171209;color:#a89a76;font-size:11px;font-family:'Inter';cursor:pointer;}
.filter-pill.active{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1c1600;border-color:transparent;font-weight:700;}
.myteam-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 10px;}
.myteam-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;}
.dup-badge{position:absolute;top:-6px;right:14px;background:linear-gradient(160deg,var(--gold-light),var(--gold));color:#1c1600;font-family:'Anton',sans-serif;font-size:11px;padding:2px 7px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:7;}

/* ===== MERCADO ===== */
.market-grid{display:flex;justify-content:center;gap:18px;margin:22px 0 8px;flex-wrap:wrap;}
.market-slot-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
.market-card{position:relative;}
.market-value{font-family:'Anton',sans-serif;font-size:12.5px;color:var(--gold-light);text-align:center;letter-spacing:.5px;}
.market-mult{color:#a89a76;font-size:10.5px;}
@keyframes marketFly0{ to{ transform:translate(-170px,-260px) rotate(-45deg) scale(.25); opacity:0; } }
@keyframes marketFly1{ to{ transform:translate(0,-320px) rotate(8deg) scale(.25); opacity:0; } }
@keyframes marketFly2{ to{ transform:translate(170px,-260px) rotate(45deg) scale(.25); opacity:0; } }
.market-fly-0{animation:marketFly0 .78s cubic-bezier(.3,.4,.7,1) forwards;}
.market-fly-1{animation:marketFly1 .78s cubic-bezier(.3,.4,.7,1) forwards;}
.market-fly-2{animation:marketFly2 .78s cubic-bezier(.3,.4,.7,1) forwards;}

/* ===== SBCs ===== */
.sbc-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px;border-radius:14px;border:1px solid rgba(232,197,101,.25);background:linear-gradient(135deg,#1a1510,#0a0908);margin-bottom:14px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.4);}
.sbc-row-name{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:.5px;color:#f0e6cc;line-height:1.2;}
.sbc-row-progress{font-size:12px;color:var(--gold-light);margin-top:4px;font-weight:700;letter-spacing:.5px;}
.sbc-card-placeholder{width:64px;aspect-ratio:0.72;flex:none;clip-path:polygon(50% 0%,88% 6%,100% 20%,100% 92%,90% 100%,10% 100%,0% 92%,0% 20%,12% 6%);background:linear-gradient(160deg,#2b2b2b,#0a0a0a);border:2px solid rgba(232,197,101,.3);display:flex;align-items:center;justify-content:center;}
.sbc-row-card{flex:none;transform:scale(.68);margin:0 -14px;}
.sbc-card-placeholder span{font-family:'Anton',sans-serif;font-size:26px;color:rgba(232,197,101,.5);}

.template-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:12px;border:1px solid rgba(232,197,101,.2);background:#171209;margin-bottom:10px;cursor:pointer;}
.template-row.done{opacity:.5;cursor:default;}
.template-row-name{font-family:'Anton',sans-serif;font-size:14px;color:#f0e6cc;}
.template-row-reward{font-size:11px;color:#a89a76;margin-top:3px;}
.difficulty-badge{font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:4px 9px;border-radius:20px;white-space:nowrap;color:#0a0908;flex:none;}
.diff-facil{background:#7fd88a;}
.diff-media{background:var(--gold-light);}
.diff-media_alta{background:#e2a223;}
.diff-alta{background:var(--red-light);}

.reqs-tab{left:auto;right:10px;flex-direction:row-reverse;}
.reqs-drawer{padding:0 4px;}
.reqs-drawer.open{max-height:340px;padding:20px 4px 6px;}
.reqs-list{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:6px;}
.reqs-list li{font-size:12.5px;color:#d8cdb2;background:rgba(232,197,101,.06);border-radius:6px;padding:6px 10px;}
.reqs-extra{font-size:11px;color:#a89a76;}
.claim-btn{box-shadow:0 0 24px rgba(232,197,101,.5);}

.sbc-claim-overlay{position:fixed;inset:0;z-index:70;cursor:pointer;overflow-y:auto;
  background:radial-gradient(70% 60% at 50% 32%, rgba(50,38,10,.65), #000 82%);
  display:block;padding:32px 16px;}
.sbc-claim-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:calc(100vh - 64px);justify-content:center;margin:0 auto;text-align:center;}
.sbc-claim-title{font-family:'Anton',sans-serif;font-size:24px;line-height:1.15;letter-spacing:1px;color:var(--gold-light);text-shadow:0 0 24px rgba(232,197,101,.7);}
.sbc-claim-card{transform:scale(1.2);margin:22px 0;}
.sbc-claim-name{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;color:#f0e6cc;margin-top:-4px;}
.sbc-claim-rewards{font-family:'Anton',sans-serif;font-size:15px;color:#fff;letter-spacing:.5px;}

.stack{position:relative;width:78px;height:96px;flex:none;}
.mini-card{position:absolute;width:56px;aspect-ratio:0.72;clip-path:polygon(50% 0%,88% 6%,100% 20%,100% 92%,90% 100%,10% 100%,0% 92%,0% 20%,12% 6%);box-shadow:0 6px 14px rgba(0,0,0,.5);}
.m1{top:14px;left:0;transform:rotate(-12deg);background:linear-gradient(160deg,#9aa1ab,#eef0f2);z-index:1;}
.m2{top:4px;left:14px;transform:rotate(-2deg);background:linear-gradient(160deg,var(--gold-deep),var(--gold-light));z-index:2;}
.m3{top:10px;left:30px;transform:rotate(10deg);background:linear-gradient(160deg,var(--gold-deep) 2%,#fffef9 60%);z-index:3;}

.grid-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8a7c5c;font-weight:700;margin:6px 0 10px 2px;}
.btn-locked{position:relative;overflow:hidden;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(135deg,#181410,#0d0b08);padding:16px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;filter:grayscale(.55);opacity:.72;}
.btn-locked.active{filter:none;opacity:1;border-color:rgba(232,197,101,.3);cursor:pointer;transition:transform .12s ease;}
.btn-locked.active:active{transform:scale(.98);}
.btn-locked.active .lock-icon{background:rgba(232,197,101,.14);}
.btn-locked.active .lock-icon svg{fill:var(--gold-light);}
.locked-left{display:flex;align-items:center;gap:12px;}
.lock-icon{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex:none;}
.lock-icon svg{width:16px;height:16px;fill:#a89a76;}
.locked-name{font-family:'Anton',sans-serif;font-size:16px;letter-spacing:.5px;color:#d8cdb2;}
.locked-sub{font-size:10.5px;color:#7a6f57;margin-top:2px;}
.ribbon{font-size:8.5px;letter-spacing:1.5px;font-weight:800;color:#0a0908;background:linear-gradient(180deg,var(--gold-light),var(--gold));padding:4px 9px;border-radius:20px;white-space:nowrap;}
footer{margin-top:auto;padding-top:22px;text-align:center;font-size:9.5px;letter-spacing:2px;color:#5c5340;text-transform:uppercase;}

/* ===== FORMATION GRID ===== */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-card{background:linear-gradient(160deg,#1c1712,#0a0908);border:1px solid rgba(232,197,101,.22);border-radius:12px;padding:12px 10px 10px;cursor:pointer;transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;box-shadow:0 6px 16px rgba(0,0,0,.35);}
.form-card:active{transform:scale(.96);border-color:rgba(232,197,101,.5);}
.mini-pitch{position:relative;width:100%;aspect-ratio:0.82;background:linear-gradient(180deg,#132015,#0c1710);border:1px solid rgba(232,197,101,.25);border-radius:6px;margin-bottom:8px;overflow:hidden;}
.mini-pitch::before{content:'';position:absolute;left:8%;right:8%;top:50%;height:1px;background:rgba(232,197,101,.3);}
.mini-pitch::after{content:'';position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;border:1px solid rgba(232,197,101,.3);border-radius:50%;transform:translate(-50%,-50%);}
.mini-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold-deep));transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.5);}
.form-name{text-align:center;font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.5px;color:#f0e6cc;}

/* ===== CAPTAIN ===== */
.cap-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.cap-name{text-align:center;font-family:'Anton',sans-serif;font-size:11px;margin-top:8px;color:#d8cdb2;}

/* ===== FC CARD (shared) ===== */
.fc-outer{width:96px;aspect-ratio:0.72;padding:3px;position:relative;cursor:pointer;background:linear-gradient(160deg,#3a3427,#151109 75%);transition:transform .16s cubic-bezier(.2,.8,.2,1), filter .16s ease;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));}
.fc-outer.tier-flashbacks{background:linear-gradient(160deg,#c9a8ff 0%,#0a0a12 10%,#7fd9f0 18%,#0a0a12 26%,#1a1440 100%);}
.fc-outer:active{transform:scale(.96);}
.fc-outer.selected{transform:translateY(-6px) scale(1.04);filter:drop-shadow(0 0 0 2px var(--gold-light)) drop-shadow(0 8px 14px rgba(0,0,0,.5));}
.fc-outer.swap-target{filter:drop-shadow(0 0 0 2px rgba(232,197,101,.5));}
.swap-hint-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 2px 14px;padding:8px 10px;border-radius:8px;background:rgba(232,197,101,.08);border:1px solid rgba(232,197,101,.2);}
.swap-hint-bar span{font-size:11px;color:#d8cdb2;}
.redraft-btn{background:none;border:1px solid rgba(232,197,101,.4);color:var(--gold-light);border-radius:6px;padding:4px 9px;font-size:10.5px;font-family:'Inter';cursor:pointer;white-space:nowrap;}
.fc-inner{clip-path:polygon(50% 0%,88% 6%,100% 20%,100% 92%,90% 100%,10% 100%,0% 92%,0% 20%,12% 6%);width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:9% 6% 6%;text-align:center;position:relative;}
.fc-inner::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(125deg, rgba(255,255,255,.16) 0 2px, transparent 2px 11px);mix-blend-mode:overlay;opacity:.7;}
.fc-inner::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 55% at 50% 0%, rgba(255,255,255,.30), transparent 62%), linear-gradient(0deg, rgba(0,0,0,.18), transparent 30%);}
.fc-inner > *{position:relative;z-index:2;}
.fc-rating{font-family:'Playfair Display',serif;font-weight:800;font-size:13px;line-height:1;margin-bottom:2px;}
.fc-photo{width:52%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#2c2a22;margin-bottom:6%;border:1.5px solid rgba(255,255,255,.45);flex-shrink:0;}
.fc-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.fc-name{font-family:'Playfair Display',serif;font-weight:700;font-size:10px;line-height:1.15;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95%;}
.fc-pos{font-size:7.5px;letter-spacing:1px;text-transform:uppercase;opacity:.9;}

.card-wrap{position:relative;}
.pos-badge{
  position:absolute;right:-11px;top:40px;z-index:6;
  background:linear-gradient(160deg,#2b2b2b,#080808);
  color:var(--gold-light);font-family:'Playfair Display',serif;font-weight:700;font-size:8px;letter-spacing:.3px;
  padding:4px 6px 4px 8px;line-height:1.3;text-align:left;
  clip-path:polygon(16% 0%,100% 0%,100% 100%,16% 100%,0% 50%);
  box-shadow:0 3px 9px rgba(0,0,0,.45);
}

.fc-inner.tier-plata{background:linear-gradient(160deg,#9aa1ab,#c3c8cf 45%,#eef0f2);color:#20232a;}
.tier-plata .fc-name{color:#141619;}
.fc-inner.tier-oro{background:linear-gradient(160deg,var(--gold-deep),var(--gold) 45%,var(--gold-light));color:#2c1a00;}
.tier-oro .fc-name{color:#241300;}
.fc-inner.tier-ororaro{background:linear-gradient(160deg,#7a4508,#e2a223 45%,#fff0b8);color:#2c1a00;}
.tier-ororaro .fc-name{color:#241300;}
.fc-inner.tier-if{background:linear-gradient(160deg,#1c1030,#6a4fae 45%,#c9a8ff);color:#f4ecff;}
.tier-if .fc-name{color:#fff;}
.fc-inner.tier-mvp{background:linear-gradient(160deg,#210a02,#a8330f 42%,#ff8f4a 80%,#ffcf8a);color:#fff4ea;}
.tier-mvp .fc-name{color:#fff;}
.fc-inner.tier-toty{background:linear-gradient(160deg,#4d7295,#a9c9e0 45%,#eaf4fb);color:#122335;}
.tier-toty .fc-name{color:#0c1a26;}
.fc-inner.tier-shapeshifter{background:linear-gradient(135deg,#ffd36e,#38e1c6 40%,#7b5cff 75%,#ff6fae);color:#fff;}
.tier-shapeshifter .fc-name{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);}
.fc-inner.tier-futurestar{background:linear-gradient(160deg,#03211d,#1f9b7f 45%,#9dffe0);color:#eafff8;}
.tier-futurestar .fc-name{color:#fff;}
.fc-inner.tier-icono{background:linear-gradient(160deg,var(--gold-deep) 2%,#f7efd9 30%,#fffef9 65%,#ffffff 100%);color:#3a2c05;}
.tier-icono .fc-name{font-weight:800;color:#2c2005;}
.fc-inner.tier-parche{background:linear-gradient(160deg,var(--red-deep),var(--red) 55%,var(--red-light));color:#fff4f2;}
.tier-parche .fc-name{color:#fff;}
.fc-inner.tier-parche-estrella{background:linear-gradient(160deg,var(--red-deep),var(--red) 40%,var(--gold) 72%,var(--gold-light));color:#fff4f2;}
.tier-parche-estrella .fc-name{color:#fff;}
.fc-inner.tier-tots{background:linear-gradient(160deg,#073540,#1c93ab 42%,#7fe0d8 68%,var(--gold-light) 100%);color:#052229;}
.tier-tots .fc-name{color:#052229;}
.fc-inner.tier-balondeoro{background:linear-gradient(160deg,#050608 0%,#0e2c52 40%,#050608 70%,var(--gold) 92%,var(--gold-light) 100%);color:#fff4dd;}
.tier-balondeoro .fc-name{color:#fff;}
.fc-inner.tier-sbc{background:linear-gradient(115deg,
  #c4202f 0%, #c4202f 43%,
  #0a0a0a 45%, #7a5f1a 48%, #e8c565 50%, #7a5f1a 52%, #0a0a0a 55%,
  #1c3f9a 57%, #1c3f9a 100%);color:#fff;}
.tier-sbc .fc-name{color:#fff;}
.fc-inner.tier-sbcnominated{background:linear-gradient(115deg,
  #6e242c 0%, #6e242c 43%,
  #0a0a0a 45%, #0a0a0a 55%,
  #223a6b 57%, #223a6b 100%);color:#e8e0d0;}
.tier-sbcnominated .fc-name{color:#e8e0d0;}
.fc-inner.tier-flashbacks{background:linear-gradient(170deg,
  #05040f 0%, #150f38 16%, #2a2270 32%, #3f6bc9 46%,
  #7fe0f0 58%, #6a4fc9 70%, #241a52 86%, #0a0e28 100%);color:#eef2ff;}
.tier-flashbacks .fc-name{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);}

/* ===== PITCH SCREEN ===== */
.stat-bar{display:flex;gap:10px;margin-bottom:16px;}
.stat-box{position:relative;flex:1;background:linear-gradient(135deg,#1c1712,#0a0908);border:1px solid rgba(232,197,101,.25);border-radius:10px;padding:10px 12px;text-align:center;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.35);}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-light),transparent);opacity:.7;}
.stat-box .lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:#a89a76;font-weight:700;}
.stat-box .val{font-family:'Anton',sans-serif;font-size:22px;color:var(--gold-light);margin-top:2px;text-shadow:0 0 16px rgba(232,197,101,.35);}
.pip-row{display:flex;gap:3px;justify-content:center;margin-top:6px;}
.pip{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);}
.pip.on{background:linear-gradient(160deg,var(--gold-light),var(--gold));box-shadow:0 0 4px rgba(232,197,101,.7);}

.pitch{position:relative;width:100%;aspect-ratio:0.68;border-radius:12px;overflow:visible;margin-bottom:10px;}
.pitch-surface{
  position:absolute;inset:0;border-radius:12px;overflow:hidden;border:1px solid rgba(232,197,101,.4);
  background:
    radial-gradient(55% 32% at 50% 0%, rgba(232,197,101,.22), transparent 60%),
    radial-gradient(80% 45% at 50% 45%, rgba(80,140,90,.18), transparent 65%),
    radial-gradient(70% 50% at 15% 100%, rgba(20,60,40,.55), transparent 60%),
    radial-gradient(70% 50% at 85% 100%, rgba(20,60,40,.55), transparent 60%),
    repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 2px, transparent 2px 26px),
    linear-gradient(180deg,#102010,#070d07 55%,#020302 100%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.7), inset 0 0 0 1px rgba(232,197,101,.1), inset 0 2px 0 rgba(232,197,101,.15);
}
.pitch-surface::before{content:'';position:absolute;left:6%;right:6%;top:50%;height:1px;background:rgba(232,197,101,.3);}
.pitch-surface::after{content:'';position:absolute;left:50%;top:50%;width:24%;aspect-ratio:1;border:1px solid rgba(232,197,101,.3);border-radius:50%;transform:translate(-50%,-50%);}
.pslot{position:absolute;transform:translate(-50%,-50%);width:19%;z-index:2;}

.pslot-empty{width:100%;aspect-ratio:0.72;border-radius:10px;border:2px dashed rgba(232,197,101,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:rgba(10,9,8,.55);}
.pslot-empty .plus{font-family:'Anton',sans-serif;font-size:18px;color:var(--gold-light);line-height:1;}
.pslot-empty .role{font-size:7.5px;letter-spacing:1px;color:#a89a76;text-transform:uppercase;font-weight:700;}
.bench-empty{width:96px;aspect-ratio:0.72;border-radius:10px;border:2px dashed rgba(232,197,101,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:rgba(10,9,8,.55);}
.bench-empty .plus{font-family:'Anton',sans-serif;font-size:18px;color:var(--gold-light);line-height:1;}
.bench-empty .role{font-size:7.5px;letter-spacing:1px;color:#a89a76;text-transform:uppercase;font-weight:700;}
.market-slot-empty{width:96px;aspect-ratio:0.72;border-radius:10px;border:2px dashed rgba(232,197,101,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;background:rgba(10,9,8,.55);}
.market-slot-empty .plus{font-family:'Anton',sans-serif;font-size:18px;color:var(--gold-light);line-height:1;}
.market-slot-empty .role{font-size:7.5px;letter-spacing:1px;color:#a89a76;text-transform:uppercase;font-weight:700;}
.pslot .fc-outer{width:100%;}
.cap-star{position:absolute;top:-7px;right:-4px;width:16px;height:16px;border-radius:50%;background:linear-gradient(160deg,var(--gold-light),var(--gold));display:flex;align-items:center;justify-content:center;font-size:9px;box-shadow:0 2px 5px rgba(0,0,0,.5),0 0 8px rgba(232,197,101,.6);z-index:5;}

.subs-tab{position:absolute;left:10px;bottom:-14px;z-index:6;background:linear-gradient(160deg,var(--gold-light),var(--gold));color:#1c1600;font-family:'Anton',sans-serif;font-size:11px;letter-spacing:1.5px;padding:7px 14px 7px 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px;box-shadow:0 4px 10px rgba(0,0,0,.5);}
.subs-tab .arrow{transition:transform .25s ease;font-size:10px;}
.subs-tab.open .arrow{transform:rotate(180deg);}
.subs-drawer{overflow:hidden;max-height:0;transition:max-height .32s ease;}
.subs-drawer.open{max-height:180px;}
.subs-inner{display:flex;gap:14px;justify-content:center;padding:22px 4px 6px;}

.foot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;margin-bottom:16px;}
.foot-formation{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:1px;color:#a89a76;}
.save-btn{padding:12px 26px;border:none;border-radius:10px;font-family:'Anton',sans-serif;font-size:14px;letter-spacing:1px;background:linear-gradient(180deg,var(--gold-light),var(--gold));color:#1c1600;cursor:pointer;}
.save-btn:disabled{opacity:.35;cursor:not-allowed;}

/* ===== PICKER OVERLAY ===== */
.overlay{position:fixed;inset:0;background:rgba(6,5,3,.86);display:flex;align-items:flex-end;z-index:50;}
.sheet{width:100%;max-width:430px;margin:0 auto;background:linear-gradient(180deg,#171209,#0a0908);border-radius:18px 18px 0 0;border-top:1px solid rgba(232,197,101,.35);padding:20px 18px 26px;}
.sheet-title{font-family:'Playfair Display',serif;font-size:16px;text-align:center;margin-bottom:14px;color:#f0e6cc;}
.opt-row{display:flex;gap:14px;justify-content:center;}
.close-sheet{display:block;margin:16px auto 0;background:none;border:none;color:#a89a76;font-size:12px;text-decoration:underline;cursor:pointer;}

/* Picker del draft: ocupa media pantalla y no tiene forma de cerrarse sin
   elegir una carta (sin botón cancelar, sin cerrar tocando el fondo). */
.sheet-forced{
  min-height:50vh; max-height:88vh; overflow-y:auto;
  display:flex; flex-direction:column; justify-content:center;
  box-shadow:0 -20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  border-top:1px solid rgba(232,197,101,.5);
}
.sheet-forced .sheet-title{font-size:19px;margin-bottom:22px;}
.sheet-forced .opt-row{flex-wrap:wrap;row-gap:26px;}
.sheet-forced .hint{margin-top:24px;opacity:.75;}
</style>

// Jugadores nuevos (+ Añadir jugador) y ediciones a jugadores existentes se
// guardan en localStorage como "overrides" por id, y se aplican sobre el POOL
// embebido al iniciar. Un override puede ser un jugador nuevo (id no existía
// en el roster) o una versión editada de uno que ya existía.
const OVERRIDES_KEY = 'futdjm_overrides';
// Devuelve true/false según si se pudo guardar de verdad — si el navegador
// rechaza el write por falta de espacio (localStorage lleno, típicamente por
// fotos pesadas acumuladas), antes esto fallaba en silencio: la carta se veía
// bien en esa sesión pero desaparecía al volver a cargar la página porque
// nunca había quedado guardada.
function saveOverride(player){
  let overrides = {};
  try{ overrides = JSON.parse(localStorage.getItem(OVERRIDES_KEY)) || {}; }catch(e){}
  overrides[player.id] = player;
  try{
    localStorage.setItem(OVERRIDES_KEY, JSON.stringify(overrides));
    return true;
  }catch(e){
    return false;
  }
}
function deleteOverride(id){
  let overrides = {};
  try{ overrides = JSON.parse(localStorage.getItem(OVERRIDES_KEY)) || {}; }catch(e){}
  delete overrides[id];
  localStorage.setItem(OVERRIDES_KEY, JSON.stringify(overrides));
}
function loadOverrides(){
  try{
    const raw = localStorage.getItem(OVERRIDES_KEY);
    if(!raw) return;
    const overrides = JSON.parse(raw);
    Object.keys(overrides).forEach(id=>{
      const idx = POOL.findIndex(p=>p.id===id);
      // Mezcla en vez de reemplazar: si un override viejo (guardado antes de
      // que existiera algún campo nuevo) no lo trae, se conserva el del roster
      // embebido en vez de perderlo.
      if(idx>=0) POOL[idx] = Object.assign({}, POOL[idx], overrides[id]);
      else POOL.push(overrides[id]);
    });
  }catch(e){}
}

// Da un slot de layout (x,y del formation) a cada requisito de la plantilla:
// si el requisito trae "position" y esa posición está libre en la formación,
// se lo asigna; el resto se reparte en los slots de formación que sobren.
function templateLayoutSlots(template){
  const layout = FORMATIONS[template.formation].slice();
  const used = new Array(layout.length).fill(false);
  const positions = new Array(template.requirements.length).fill(null);
  template.requirements.forEach((req,i)=>{
    if(!req.position) return;
    const idx = layout.findIndex((s,li)=> !used[li] && s.role===req.position);
    if(idx>=0){ used[idx]=true; positions[i] = layout[idx]; }
  });
  let li = 0;
  positions.forEach((pos,i)=>{
    if(pos) return;
    while(li<layout.length && used[li]) li++;
    if(li<layout.length){ positions[i] = layout[li]; used[li]=true; li++; }
    else positions[i] = {x:50,y:50};
  });
  return positions;
}
function reqLabel(req){

// Solo cartas repetidas (2+ copias) que cumplan persona + media mínima del
// requisito, dejando margen para poder usar la misma carta en dos requisitos
// distintos de la misma plantilla si hay copias suficientes.
function templateEligiblePlayers(template, slotIndex){
  const req = template.requirements[slotIndex];
  const col = getCollection();
  const alreadyUsed = {};
  (state.templateSlots||[]).forEach((id,i)=>{ if(id && i!==slotIndex) alreadyUsed[id] = (alreadyUsed[id]||0)+1; });
  let candidates = POOL.filter(p=>{
    if(p.person !== req.person) return false;
    if(req.minRating && p.rating < req.minRating) return false;
    const owned = col[p.id]||0;
    if(owned < 2) return false;
    if(owned <= (alreadyUsed[p.id]||0)) return false;
    return true;
  });
  if(state.templatePickerFilter && state.templatePickerFilter!=='ALL'){
    candidates = candidates.filter(p=>p.positions.indexOf(state.templatePickerFilter)>=0);
  }
  return candidates.sort((a,b)=>b.rating-a.rating);
}
function templateRequirementsMet(template, slots){
  if(!slots || slots.length!==template.requirements.length) return false;
  if(slots.some(s=>!s)) return false;
  for(let i=0;i<template.requirements.length;i++){
    const req = template.requirements[i];
    const p = byId(slots[i]);
    if(!p || p.person!==req.person) return false;
    if(req.minRating && p.rating<req.minRating) return false;
  }
  const filledCount = slots.filter(Boolean).length;
  if(template.maxPlayers && filledCount>template.maxPlayers) return false;
  if(template.minPlayers && filledCount<template.minPlayers) return false;
  if(template.minChemistry){
    const layoutSlots = templateLayoutSlots(template);
    const chem = slots.reduce((sum,id,i)=>{
      if(!id) return sum;
      const p = byId(id);
      const role = layoutSlots[i] ? layoutSlots[i].role : null;
      return sum + (role && p.positions.includes(role) ? 10 : 0);
    }, 0);
    if(chem<template.minChemistry) return false;
  }
  return true;
}

function pickPackPlayer(probs){
  const r = Math.random();
  let cum = 0, bandIdx = probs.length-1;
  for(let i=0;i<probs.length;i++){
    cum += probs[i];
    if(r <= cum){ bandIdx = i; break; }
  }
  let candidates = [];
  let offset = 0;
  while(candidates.length===0 && offset < RATING_BANDS.length){
    const tryIdx = [bandIdx-offset, bandIdx+offset].filter(i=>i>=0 && i<RATING_BANDS.length);
    for(const i of tryIdx){
      const band = RATING_BANDS[i];
      candidates = POOL.filter(p=>p.rating>=band.min && p.rating<=band.max && p.packEligible!==false);
      if(candidates.length) break;
    }
    offset++;
  }
  if(candidates.length===0) candidates = POOL.filter(p=>p.packEligible!==false);
  if(candidates.length===0) candidates = POOL;
  return candidates[Math.floor(Math.random()*candidates.length)];
}
function openPackDraw(probs){
  const players = [pickPackPlayer(probs), pickPackPlayer(probs), pickPackPlayer(probs)];
  players.sort((a,b)=>b.rating-a.rating);
  return players;
}
// Arranca la animación de apertura de un sobre — se usa tanto para los que se
// compran en la Tienda como para los que ya se tienen guardados en Mis Packs.
function startPackFlow(packId){
  const pack = packById(packId);
  state.activePackId = packId;
  state.packDraw = openPackDraw(pack.probs);
  state.packSpecial = state.packDraw[0].rating >= 86;
  state.packStage = 'spinning';
  render();
  const spinDuration = state.packSpecial ? 1700 : 850;
  setTimeout(()=>{
    if(state.packSpecial){
      state.packStage = 'buildup';
      state.packRevealRating = 0;
      render();
      const target = state.packDraw[0].rating;
      const stepTime = 45;
      const steps = Math.ceil(1350/stepTime);
      let i = 0;
      const timer = setInterval(()=>{
        i++;
        state.packRevealRating = Math.min(target, Math.round(target*(i/steps)));
        if(i>=steps){ clearInterval(timer); }
        render();
      }, stepTime);
      setTimeout(()=>{
        state.packStage = 'revealed-top';
        render();
      }, 1500);
    } else {
      state.packStage = 'revealed-top';
      render();
    }
  }, spinDuration);
}

function getSlotPositions(formationKey){
  const layout = FORMATIONS[formationKey];
  const counts = {};
  return layout.map(slot=>{
    const i = counts[slot.role] || 0;
    counts[slot.role] = i + 1;

// Usados en el draft actual: titulares (salvo el slot que se está reabriendo, para
// poder reconsiderarlo) + suplentes ya elegidos (reservados — solo entran a la
// cancha por swap, salvo el propio slot de banco que se está reabriendo).
function usedIds(excludeSlotId, excludeBenchIndex){
  const placed = state.slots.filter(s=>s.playerId && s.id!==excludeSlotId).map(s=>s.playerId);
  const bench = (state.bench||[]).filter((id,i)=> id && i!==excludeBenchIndex);
  return placed.concat(bench);
}
// Personas ya usadas en el draft actual (misma exclusión que usedIds, pero por
// "person" en vez de id — así dos cartas de la misma persona, como las dos de
// Rai, nunca pueden estar juntas en el mismo equipo).
function usedPersons(excludeSlotId, excludeBenchIndex){
  return usedIds(excludeSlotId, excludeBenchIndex)
    .map(id=>{ const p = byId(id); return p ? p.person : null; })
    .filter(Boolean);
}

// Selección ponderada sin reemplazo: los jugadores con foto propia pesan 3x más
// que los que aún usan el placeholder en blanco (menos probables de salir).
function weightedPick(candidates, n){
  const pool = candidates.map(p=>({p, w: p.photo ? 3 : 1}));
  const out = [];
  while(out.length < n && pool.length){
    const total = pool.reduce((s,x)=>s+x.w, 0);
    let r = Math.random()*total, idx = 0;
    for(; idx<pool.length-1; idx++){ r -= pool[idx].w; if(r<=0) break; }
    out.push(pool.splice(idx,1)[0].p);
  }
  return out;
}

// Arma n opciones priorizando que sean del mismo "nivel" (bucket de media) en vez
// de mezclar al azar cualquier rareza — para que el draft se sienta menos errático
// (o salen todos muy buenos, o todos medianos, o todos flojos).
function bucketedPick(candidates, n){
  if(candidates.length <= n) return weightedPick(candidates, n);
  const sorted = candidates.slice().sort((a,b)=>b.rating-a.rating);
  const size = Math.ceil(sorted.length/3);
  const buckets = [sorted.slice(0,size), sorted.slice(size,size*2), sorted.slice(size*2)].filter(b=>b.length);
  const bucket = buckets[Math.floor(Math.random()*buckets.length)];
  const picked = weightedPick(bucket, n);
  if(picked.length < n){
    const rest = candidates.filter(p=>!picked.includes(p));
    picked.push(...weightedPick(rest, n-picked.length));
  }
  return picked;
}

// Si no hay 3 jugadores disponibles para la posición pedida, se completa con
// jugadores de media parecida aunque no jueguen ahí (van a dar 0 de química si
// se eligen — eso ya lo maneja el cálculo de química por posición real).
function optionsFor(role, excludeSlotId){
  const used = usedIds(excludeSlotId);
  const usedP = usedPersons(excludeSlotId);
  const inPosition = POOL.filter(p=> p.positions.includes(role) && !used.includes(p.id) && !usedP.includes(p.person));
  let picked = bucketedPick(inPosition, 3);
  if(picked.length < 3){
    const avgRating = picked.length ? picked.reduce((s,p)=>s+p.rating,0)/picked.length : 80;
    const outOfPosition = POOL.filter(p=> !p.positions.includes(role) && !used.includes(p.id) && !usedP.includes(p.person) && picked.indexOf(p)<0);
    const closest = outOfPosition.slice().sort((a,b)=>Math.abs(a.rating-avgRating)-Math.abs(b.rating-avgRating));
    picked = picked.concat(closest.slice(0, 3-picked.length));
  }
  return picked;
}

function pickCaptainCandidates(formationKey){
  const roles = new Set(FORMATIONS[formationKey].map(s=>s.role));
  const eligible = POOL.filter(p=> roles.has(p.positions[0]));
  return bucketedPick(eligible, 3);
}

// Los suplentes no tienen una posición fija (no ocupan un slot de la cancha
// todavía), así que las opciones no se filtran por rol — cualquier jugador libre
// puede entrar al banco.
function optionsForBench(excludeBenchIndex){
  const used = usedIds(null, excludeBenchIndex);
  const usedP = usedPersons(null, excludeBenchIndex);
  const candidates = POOL.filter(p=>!used.includes(p.id) && !usedP.includes(p.person));
  return bucketedPick(candidates, 3);
}

function loadImageSafe(src){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>{
      const blank = new Image();
      blank.onload = ()=>resolve(blank);
      blank.onerror = ()=>resolve(blank);
      blank.src = PHOTO_DATA;
    };
    img.src = src;
  });
}
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
// Mismo polígono que el clip-path de .fc-outer/.fc-inner en CSS, para que las
// cartas del póster tengan la misma silueta hexagonal que las cartas reales.
function hexPath(ctx, x, y, w, h){
  const pts = [[.50,0],[.88,.06],[1,.20],[1,.92],[.90,1],[.10,1],[0,.92],[0,.20],[.12,.06]];
  ctx.beginPath();
  pts.forEach((pt,i)=>{
    const px = x + pt[0]*w, py = y + pt[1]*h;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.closePath();
}
// Mismos degradados que las clases .fc-inner.tier-X del CSS, para que cada
// carta del póster tenga el color real de su rareza.
const TIER_GRADIENT_STOPS = {
  plata:['#9aa1ab','#c3c8cf','#eef0f2'], oro:['#6e5717','#b5922e','#e8c565'],
  ororaro:['#7a4508','#e2a223','#fff0b8'], if:['#1c1030','#6a4fae','#c9a8ff'],
  mvp:['#210a02','#a8330f','#ff8f4a','#ffcf8a'], shapeshifter:['#ffd36e','#38e1c6','#7b5cff','#ff6fae'],
  futurestar:['#03211d','#1f9b7f','#9dffe0'], icono:['#6e5717','#f7efd9','#fffef9','#ffffff'],
  parche:['#4a0d13','#93202b','#cf7982'], 'parche-estrella':['#4a0d13','#93202b','#b5922e','#e8c565'],
  tots:['#073540','#1c93ab','#7fe0d8','#e8c565'], balondeoro:['#050608','#0e2c52','#050608','#b5922e','#e8c565'],
  sbc:['#c4202f','#0a0a0a','#e8c565','#0a0a0a','#1c3f9a'],
  sbcnominated:['#6e242c','#0a0a0a','#0a0a0a','#223a6b'],
  flashbacks:['#05040f','#2a2270','#3f6bc9','#7fe0f0','#6a4fc9','#0a0e28'],
};
const TIER_TEXT_COLOR = {
  plata:'#141619', oro:'#241300', ororaro:'#241300', icono:'#2c2005', tots:'#052229',
  if:'#ffffff', mvp:'#ffffff', shapeshifter:'#ffffff', futurestar:'#ffffff', parche:'#ffffff', 'parche-estrella':'#ffffff', balondeoro:'#ffffff',
  sbc:'#ffffff', sbcnominated:'#e8e0d0', flashbacks:'#eef2ff'
};
function tierGradient(ctx, x0,y0,x1,y1, tier){
  const stops = TIER_GRADIENT_STOPS[tier] || TIER_GRADIENT_STOPS.oro;
  const g = ctx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach((c,i)=> g.addColorStop(i/(stops.length-1), c));
  return g;
}
// Las fuentes de Google (Anton/Playfair) están cargadas en la página pero el
// canvas no las usa hasta que se confirma que terminaron de descargar — sin
// esto, el póster caía al font por defecto y se veía genérico.
function ensurePosterFonts(){
  return Promise.all([
    document.fonts.load('800 60px "Anton"'),
    document.fonts.load('900 60px "Playfair Display"'),
    document.fonts.load('800 30px "Playfair Display"'),
    document.fonts.load('700 22px "Playfair Display"'),
    document.fonts.load('700 20px "Inter"'),
  ]).catch(()=>{});
}
function drawMiniCard(ctx, cx, cy, w, player, img, isCaptain){
  const h = w/0.72;
  const x = cx-w/2, y = cy-h/2;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
  hexPath(ctx, x-w*0.035, y-w*0.035, w*1.07, h*1.035);
  ctx.fillStyle = '#1c160d';
  ctx.fill();
  ctx.restore();

  hexPath(ctx, x, y, w, h);
  ctx.save();
  ctx.fillStyle = tierGradient(ctx, x, y, x+w, y+h, player.tier);
  ctx.fill();
  ctx.clip();
  // brillo diagonal, como el overlay de .fc-inner::after
  const sheen = ctx.createLinearGradient(x, y, x+w*0.3, y+h*0.6);
  sheen.addColorStop(0, 'rgba(255,255,255,.38)'); sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen; ctx.fillRect(x,y,w,h);

  const textColor = TIER_TEXT_COLOR[player.tier] || '#241300';
  ctx.fillStyle = textColor; ctx.textAlign = 'center';
  ctx.font = '800 '+Math.round(w*0.20)+'px "Playfair Display", Georgia, serif';
  ctx.fillText(String(player.rating), x+w*0.5, y+h*0.235);

  const pr = w*0.235, pcx = x+w*0.5, pcy = y+h*0.475;
  ctx.save();
  ctx.beginPath(); ctx.arc(pcx,pcy,pr,0,Math.PI*2); ctx.closePath(); ctx.clip();
  ctx.fillStyle = '#2c2a22'; ctx.fillRect(pcx-pr,pcy-pr,pr*2,pr*2);
  if(img) ctx.drawImage(img, pcx-pr, pcy-pr, pr*2, pr*2);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = Math.max(1.5, w*0.014);
  ctx.beginPath(); ctx.arc(pcx,pcy,pr,0,Math.PI*2); ctx.stroke();

  ctx.font = '700 '+Math.round(w*0.108)+'px "Playfair Display", Georgia, serif';
  const shortName = player.name.length>13 ? player.name.slice(0,12)+'…' : player.name;
  ctx.fillText(shortName, x+w*0.5, y+h*0.80);
  ctx.restore();

  hexPath(ctx, x, y, w, h);
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();

  if(isCaptain){
    const scx = x+w*0.85, scy = y+h*0.06, sr = w*0.11;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(scx,scy,sr,0,Math.PI*2);
    const g2 = ctx.createLinearGradient(scx-sr,scy-sr,scx+sr,scy+sr);
    g2.addColorStop(0,'#e8c565'); g2.addColorStop(1,'#b5922e');
    ctx.fillStyle = g2; ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#1c1600'; ctx.font = '700 '+Math.round(sr*1.15)+'px Arial'; ctx.textAlign='center';
    ctx.fillText('★', scx, scy+sr*0.38);
  }
}

  ctx.restore();

  ctx.save();
  ctx.shadowColor = 'rgba(232,197,101,.5)'; ctx.shadowBlur = 30;

  ctx.textAlign = 'center';

  ctx.fillStyle = wordGrad;

  ctx.fillText('FUTDJM', W/2, 216);
  ctx.fillStyle = '#a89a76';
  ctx.font = '700 15px "Inter", Arial, sans-serif';
  const sub = 'DON JULIO DE MILÁN'+(team.formation ? ' · '+team.formation.toUpperCase() : '');
  ctx.fillText(sub, W/2, 244);
  const ruleGrad = ctx.createLinearGradient(W/2-70,0,W/2+70,0);
  ruleGrad.addColorStop(0,'rgba(232,197,101,0)'); ruleGrad.addColorStop(.5,'#e8c565'); ruleGrad.addColorStop(1,'rgba(232,197,101,0)');
  ctx.strokeStyle = ruleGrad; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W/2-70,262); ctx.lineTo(W/2+70,262); ctx.stroke();

  [{label:'MEDIA', val:String(team.avgRating), cx:W/2-150},
   {label:'QUÍMICA', val:team.chem+'/70', cx:W/2+150}].forEach(box=>{
    ctx.fillStyle = 'rgba(232,197,101,.08)';
    roundRectPath(ctx, box.cx-110, 286, 220, 96, 14); ctx.fill();
    ctx.strokeStyle = 'rgba(232,197,101,.28)'; ctx.lineWidth = 1;
    roundRectPath(ctx, box.cx-110, 286, 220, 96, 14); ctx.stroke();
    ctx.fillStyle = '#e8c565'; ctx.fillRect(box.cx-40, 286, 80, 2.5);

    ctx.fillText(box.label, box.cx, 318);
    ctx.fillStyle = '#e8c565'; ctx.font = '400 42px "Anton", Impact, sans-serif';
    ctx.fillText(box.val, box.cx, 364);

  const pitchTop = 418, pitchH = 820, pitchLeft = 55, pitchW = W-110;
  const turf = ctx.createLinearGradient(0,pitchTop,0,pitchTop+pitchH);
  turf.addColorStop(0,'#132015'); turf.addColorStop(.55,'#0c1710'); turf.addColorStop(1,'#070d09');
  roundRectPath(ctx, pitchLeft, pitchTop, pitchW, pitchH, 18);
  ctx.save(); ctx.clip();
  ctx.fillStyle = turf; ctx.fillRect(pitchLeft,pitchTop,pitchW,pitchH);
  ctx.globalAlpha = .05; ctx.fillStyle = '#fff';
  for(let yy=pitchTop; yy<pitchTop+pitchH; yy+=56){ ctx.fillRect(pitchLeft, yy, pitchW, 28); }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = 'rgba(232,197,101,.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pitchLeft+20, pitchTop+pitchH*0.5); ctx.lineTo(pitchLeft+pitchW-20, pitchTop+pitchH*0.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2, pitchTop+pitchH*0.5, pitchW*0.14, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = 'rgba(232,197,101,.35)'; ctx.lineWidth = 2;

  const cardW = pitchW * 0.205;

}
function downloadDataUrl(dataUrl, filename){
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
// En el celular (sobre todo iOS) un <a download> casi nunca termina en la
// galería de fotos — usamos la hoja de compartir nativa (con opción "Guardar
// imagen") cuando está disponible, y el link de descarga como respaldo.
async function sharePosterOrDownload(dataUrl, filename){
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const file = new File([blob], filename, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'FUTDJM', text:'Mi equipo en FUTDJM'});
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return; // el usuario cerró la hoja de compartir
  }
  downloadDataUrl(dataUrl, filename);
}
function currentTeamSnapshot(){

}

let pendingPhotoData = null;
// Achica y comprime la foto antes de guardarla en localStorage — una foto de
// cámara sin tocar puede pesar varios MB en base64, y varias cartas con foto
// llenan la cuota de localStorage del navegador (5-10MB típico). Cuando eso
// pasa el guardado falla en silencio y la carta desaparece al recargar la
// página. 300px alcanza de sobra para el círculo de la carta y el póster.
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(reader.error);
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('No se pudo leer la imagen'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderCoinBadge(){
  return '<div class="coin-badge"><span class="coin-icon"><img src="'+CREST_DATA+'"></span>'+getCoins().toLocaleString('es-CL')+' ÑUENDE COINS</div>';
}
function renderConfetti(tier){
  const colors = {plata:'#c3c8cf', oro:'#e8c565', ororaro:'#e2a223', if:'#9c7fe0', mvp:'#ff8f4a', shapeshifter:'#7b5cff', icono:'#fffef9', parche:'#cf7982', 'parche-estrella':'#e8c565', tots:'#4fd3e8', balondeoro:'#3a6bb0', sbc:'#c4202f', sbcnominated:'#223a6b', flashbacks:'#7fe0f0'};
  const c = colors[tier] || '#e8c565';
  let pieces = '';
  for(let i=0;i<28;i++){
    const left = (Math.random()*100).toFixed(1);
    const delay = (Math.random()*0.6).toFixed(2);
    const dur = (1.6+Math.random()*0.9).toFixed(2);
    const color = i%3===0 ? '#f5f1e4' : c;
    pieces += '<div class="confetti-piece" style="left:'+left+'%;animation-delay:'+delay+'s;animation-duration:'+dur+'s;background:'+color+';"></div>';
  }
  return '<div class="confetti-layer">'+pieces+'</div>';
}

function packCardHtml(pack, extraClass, dataAction){
  return '<div class="pack-card theme-'+pack.theme+(extraClass?' '+extraClass:'')+'"'+(dataAction?' data-action="openPack" data-pack-id="'+pack.id+'"':'')+'>'+
    '<div class="pack-card-pattern"></div>'+

function renderPackArea(packId){
  const pack = packById(packId);
  if(!state.packStage){
    return '<div class="pack-stage">'+
      packCardHtml(pack, '', true)+
      '<p class="hint">Tocá el sobre para abrirlo</p>'+
    '</div>';
  }
  if(state.packStage==='spinning'){
    return '<div class="pack-stage'+(state.packSpecial?' pack-special-bg':'')+'">'+
      packCardHtml(pack, 'spinning'+(state.packSpecial?' slow':''), false)+
    '</div>';
  }
  if(state.packStage==='buildup'){
    return '<div class="pack-stage pack-special-bg">'+
      '<div class="buildup-rays"></div>'+
      '<div class="buildup-rating">'+state.packRevealRating+'</div>'+
    '</div>';
  }
  if(state.packStage==='revealed-top'){
    const top = state.packDraw[0];
    const confetti = state.packSpecial ? renderConfetti(top.tier) : '';
    return '<div class="pack-stage'+(state.packSpecial?' pack-special-bg':'')+'">'+
      confetti+
      '<div class="card-wrap reveal-pop">'+fcCard(top, top.positions[0], {action:'continuePack'})+'</div>'+
      '<p class="hint">Tocá la carta para ver el resto del sobre</p>'+

  const rest = state.packDraw.map(p=>'<div class="card-wrap">'+fcCard(p, p.positions[0], {action:''})+'</div>').join('');
  return '<div class="pack-stage">'+
    '<div class="opt-row" style="flex-wrap:wrap;">'+rest+'</div>'+
    '<button class="save-btn" data-action="exitPack" style="width:100%;">Guardar en Mi Equipo</button>'+
  '</div>';

/* ---------- PITCH ---------- */
function renderPitchScreen(){
  const filled = state.slots.filter(s=>s.playerId);
  const chemPerSlot = state.slots.map(s=> s.playerId ? (byId(s.playerId).positions.includes(s.role) ? 10 : 0) : null);
  const chem = chemPerSlot.reduce((sum,v)=>sum+(v||0),0);
  const avgRating = filled.length ? Math.round(filled.reduce((sum,s)=>sum+byId(s.playerId).rating,0)/filled.length) : 0;
  const allFilled = state.slots.every(s=>s.playerId);
  const pips = chemPerSlot.map(v=>'<div class="pip '+(v===10?'on':'')+'"></div>').join('');

  const slotHtml = state.slots.map(s=>{
    if(!s.playerId){
      return '<div class="pslot" style="left:'+s.x+'%;top:'+s.y+'%;">'+
        '<div class="pslot-empty" data-action="openSlot" data-slot-id="'+s.id+'">'+
          '<div class="plus">+</div><div class="role">'+s.role+'</div>'+
        '</div>'+
      '</div>';
    }
    const p = byId(s.playerId);
    const isCap = p.id === state.captainId;
    let card = fcCard(p, s.role, {action:'openSlot'}).replace('data-id="'+p.id+'"', 'data-id="'+p.id+'" data-slot-id="'+s.id+'"');
    const isSelected = state.selectedSlotId === s.id;
    const anySelection = state.selectedSlotId || state.selectedBenchId;
    if(isSelected) card = card.replace('class="fc-outer"', 'class="fc-outer selected"');
    else if(anySelection) card = card.replace('class="fc-outer"', 'class="fc-outer swap-target"');
    return '<div class="pslot" style="left:'+s.x+'%;top:'+s.y+'%;">'+
      (isCap ? '<div class="cap-star">★</div>' : '')+
      card+
    '</div>';
  }).join('');

  const subsHtml = state.bench.map((id, i)=>{
    if(!id){
      return '<div class="card-wrap"><div class="bench-empty" data-action="openBenchSlot" data-bench-index="'+i+'">'+
        '<div class="plus">+</div><div class="role">SUB</div>'+
      '</div></div>';
    }
    const p = byId(id);
    const isSelected = state.selectedBenchId===id;
    const anySelection = state.selectedSlotId || state.selectedBenchId;
    let card = fcCard(p, p.positions[0], {action:'selectBench'});
    if(isSelected) card = card.replace('class="fc-outer"', 'class="fc-outer selected"');
    else if(anySelection) card = card.replace('class="fc-outer"', 'class="fc-outer swap-target"');
    return '<div class="card-wrap">'+card+'</div>';
  }).join('');

  const swapHint = state.selectedSlotId
    ? '<div class="swap-hint-bar"><span>Tocá otra carta para cambiarla de lugar</span><button class="redraft-btn" data-action="redraftSlot" data-slot-id="'+state.selectedSlotId+'">🔀 Redraft</button></div>'
    : state.selectedBenchId
      ? '<div class="swap-hint-bar"><span>Tocá otra carta para cambiarla de lugar</span></div>'
      : '';

  return '<button class="back-btn" data-action="backToCaptain">‹ Capitán</button>'+
    headerHtml() + swapHint +
    '<div class="stat-bar">'+
      '<div class="stat-box"><div class="lbl">Media</div><div class="val">'+avgRating+'</div></div>'+
      '<div class="stat-box"><div class="lbl">Química</div><div class="val">'+chem+'/70</div><div class="pip-row">'+pips+'</div></div>'+
    '</div>'+
    '<div class="pitch">'+
      '<div class="pitch-surface"></div>'+
      slotHtml+
      '<div class="subs-tab '+(state.subsOpen?'open':'')+'" data-action="toggleSubs">SUBS <span class="arrow">▾</span></div>'+
    '</div>'+
    '<div class="subs-drawer '+(state.subsOpen?'open':'')+'"><div class="subs-inner">'+subsHtml+'</div></div>'+
    '<div class="foot-row">'+
      '<div class="foot-formation">'+state.formation+'</div>'+
      '<button class="save-btn" data-action="saveTeam" '+(allFilled?'':'disabled')+'>Guardar equipo</button>'+
    '</div>'+
    (allFilled ? '<button class="admin-link-btn" data-action="downloadPoster" type="button">📥 Descargar como imagen</button>' : '')+
    (state.savedAt ? '<p class="hint" style="color:var(--gold-light);">Equipo guardado en DRAFT GUARDADOS ✓</p>' : '');
}

/* ---------- EVENTS ---------- */
function attachEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const action = el.getAttribute('data-action');
      if(action.slice(-2)==='Bg' && e.target !== el) return;
      handlers[action] && handlers[action](el, e);
    });
  });
  document.querySelectorAll('[data-onchange]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const action = el.getAttribute('data-onchange');
      handlers[action] && handlers[action](el, e);
    });
  });
}

const handlers = {
  goToDraft(){ state.screen='formation'; state.formationChoices = pickFormationChoices(); render(); },

  submitPlayerEdit(){

  deletePlayer(el){

    if(!window.confirm('¿Eliminar esta carta del plantel?')) return;
    const idx = POOL.findIndex(p=>p.id===id);

  requestAddPlayer(){ state.showPasswordGate = true; state.pwError = null; render(); },

  closePasswordGate(){ state.showPasswordGate = false; state.pwError = null; render(); },
  closePasswordGateBg(){ state.showPasswordGate = false; state.pwError = null; render(); },
  photoSelected(el){
    const file = el.files[0];
    if(!file){ pendingPhotoData = null; return; }
    compressImageFile(file, 300, 0.82)
      .then(dataUrl=>{ pendingPhotoData = dataUrl; })

  },
  submitPlayer(){
    const name = document.getElementById('npName').value.trim();

    const tierSel = document.getElementById('npTier').value;
    const primary = document.getElementById('npPrimary').value;

    if(!name || !rating || rating<1 || rating>99){
      state.addPlayerMsg = 'Completá nombre y media (1-99).';

    }
    const tier = tierSel==='auto' ? tierFromRating(rating) : tierSel;
    const positions = [primary].concat(extras.filter(p=>p!==primary));

    if(pendingPhotoData) player.photo = pendingPhotoData;
    POOL.push(player);
    if(!saveOverride(player)){
      POOL.pop();
      state.addPlayerMsg = 'No se pudo guardar: se llenó el espacio de almacenamiento del navegador. Borrá alguna carta vieja con foto desde "Editar jugadores existentes" para liberar espacio y probá de nuevo.';
      render();
      return;
    }
    const sbcSel = document.getElementById('npSbc').value;
    linkCardToSbc(id, sbcSel);

  },
  backToHome(){ state.screen='home'; state.formation=null; state.captainId=null; state.slots=[]; state.bench=[]; state.activeSlotId=null; state.activeBenchIndex=null; state.selectedSlotId=null; state.selectedBenchId=null; state.savedAt=null; render(); },
  pickFormation(el){
    state.formation = el.getAttribute('data-formation');
    state.captainCandidates = pickCaptainCandidates(state.formation).map(p=>p.id);
    state.screen = 'captain';
    render();
  },
  backToFormation(){ state.screen='formation'; state.formation=null; render(); },
  pickCaptain(el){
    const id = el.getAttribute('data-id');
    state.captainId = id;
    state.slots = getSlotPositions(state.formation);
    const p = byId(id);
    const primaryRole = p.positions[0];
    const target = state.slots.find(s=>s.role===primaryRole && !s.playerId);
    if(target) target.playerId = id;
    state.bench = [null, null, null];
    // Por si quedó algo colgado de una sesión de draft anterior (picker
    // abierto, selección de swap) — arranca siempre en limpio.
    state.activeSlotId = null;
    state.activeBenchIndex = null;
    state.selectedSlotId = null;
    state.selectedBenchId = null;
    state.screen = 'pitch';
    render();
  },
  backToCaptain(){ state.screen='captain'; state.slots=[]; state.bench=[]; state.activeSlotId=null; state.activeBenchIndex=null; state.selectedSlotId=null; state.selectedBenchId=null; state.captainId=null; render(); },
  openSlot(el){
    const slotId = el.getAttribute('data-slot-id');
    const slot = state.slots.find(s=>s.id===slotId);

    // Algo ya seleccionado (otro titular o un suplente) -> completar el cambio.
    if(state.selectedSlotId || state.selectedBenchId){
      if(!slot.playerId){
        // No se puede cambiar hacia un slot vacío — se cancela la selección y
        // se abre el picker normal para llenarlo.
        state.selectedSlotId = null;
        state.selectedBenchId = null;
        state.activeSlotId = slotId;
        render();
        return;
      }
      if(state.selectedSlotId){
        if(state.selectedSlotId === slotId){
          state.selectedSlotId = null;
          render();
          return;
        }
        const otherSlot = state.slots.find(s=>s.id===state.selectedSlotId);
        const tmp = otherSlot.playerId;
        otherSlot.playerId = slot.playerId;
        slot.playerId = tmp;
        state.selectedSlotId = null;
        state.savedAt = null;
        render();
        return;
      }
      // selectedBenchId
      const benchIdx = state.bench.indexOf(state.selectedBenchId);
      const starterId = slot.playerId;
      slot.playerId = state.selectedBenchId;
      state.bench[benchIdx] = starterId;
      state.selectedBenchId = null;
      state.savedAt = null;
      render();
      return;
    }

    // Nada seleccionado todavía.
    if(!slot.playerId){
      state.activeSlotId = slotId; // vacío -> abrir picker normal
      render();
      return;
    }
    // Lleno, sin selección previa -> seleccionarlo para cambiarlo de lugar.
    state.selectedSlotId = slotId;
    render();
  },
  redraftSlot(el){
    state.selectedSlotId = null;
    state.activeSlotId = el.getAttribute('data-slot-id');
    render();
  },
  selectBench(el){
    const id = el.getAttribute('data-id');
    if(state.selectedSlotId){
      const slot = state.slots.find(s=>s.id===state.selectedSlotId);
      const benchIdx = state.bench.indexOf(id);
      const starterId = slot.playerId;
      slot.playerId = id;
      state.bench[benchIdx] = starterId;
      state.selectedSlotId = null;
      state.savedAt = null;
      render();
      return;
    }
    if(state.selectedBenchId === id){
      state.selectedBenchId = null;
      render();
      return;
    }
    if(state.selectedBenchId){
      const idxA = state.bench.indexOf(state.selectedBenchId);
      const idxB = state.bench.indexOf(id);
      state.bench[idxA] = id;
      state.bench[idxB] = state.selectedBenchId;
      state.selectedBenchId = null;
      render();
      return;
    }
    state.selectedBenchId = id;
    render();
  },
  assignSlot(el){
    const id = el.getAttribute('data-id');
    const slot = state.slots.find(s=>s.id===state.activeSlotId);
    slot.playerId = id;
    state.activeSlotId = null;
    state.savedAt = null;
    render();
  },
  openBenchSlot(el){ state.activeBenchIndex = parseInt(el.getAttribute('data-bench-index'), 10); render(); },
  assignBench(el){
    const id = el.getAttribute('data-id');
    state.bench[state.activeBenchIndex] = id;
    state.activeBenchIndex = null;
    state.savedAt = null;
    render();

  exitPack(){

  setMyTeamFilter(el){ state.myTeamFilter = el.getAttribute('data-code'); render(); },

  goToMarket(){ state.screen='market'; state.marketSlots=[null,null,null]; state.activeMarketIndex=null; state.marketSelling=false; render(); },
  openMarketSlot(el){ state.activeMarketIndex = parseInt(el.getAttribute('data-market-index'),10); render(); },
  assignMarket(el){

    state.marketSlots[state.activeMarketIndex] = id;
    state.activeMarketIndex = null;
    render();
  },
  closeMarketPicker(){ state.activeMarketIndex = null; render(); },
  closeMarketPickerBg(){ state.activeMarketIndex = null; render(); },
  sellMarket(){
    if(state.marketSelling) return;
    const col = getCollection();
    let total = 0;
    state.marketSlots.forEach((id,i)=>{
      if(!id) return;
      const p = byId(id);
      total += marketValue(p.rating, i);
      col[id] = Math.max(0, (col[id]||0) - marketBundleSize(p.rating));
    });
    saveCollection(col);
    addCoins(total);
    state.marketSelling = true;
    render();
    setTimeout(()=>{
      state.marketSlots = [null,null,null];
      state.marketSelling = false;
      render();
    }, 780);
  },

  assignTemplateSlot(el){
    const id = el.getAttribute('data-id');
    state.templateSlots[state.activeTemplateSlotIndex] = id;
    state.activeTemplateSlotIndex = null;
    render();
  },
  setTemplateFilter(el){ state.templatePickerFilter = el.getAttribute('data-code'); render(); },
  closeTemplatePicker(){ state.activeTemplateSlotIndex = null; render(); },
  closeTemplatePickerBg(){ state.activeTemplateSlotIndex = null; render(); },
  toggleTemplateReqs(){ state.templateReqsOpen = !state.templateReqsOpen; render(); },
  submitTemplate(){
    const template = templateById(state.activeSbcId, state.activeTemplateId);
    if(!templateRequirementsMet(template, state.templateSlots)) return;
    const col = getCollection();
    state.templateSlots.forEach(id=>{ if(id) col[id] = Math.max(0, (col[id]||0)-1); });
    saveCollection(col);
    template.rewardPacks.forEach(r=> addMyPacks(r.packId, r.count));
    addCoins(template.rewardCoins);
    const prog = getSbcProgress();
    prog[template.id] = true;
    saveSbcProgress(prog);
    state.sbcMsg = '¡Plantilla "'+template.name+'" completada! +'+template.rewardCoins.toLocaleString('es-CL')+' 🪙 y sobres nuevos en Mis Packs.';
    state.screen = 'sbctemplates';
    state.templateSlots = [];
    state.activeTemplateId = null;
    render();
  },
  claimSbcReward(el){
    const sbcId = el.getAttribute('data-sbc-id');
    const sbc = sbcById(sbcId);
    if(!isSbcFullyDone(sbc) || isSbcClaimed(sbc)) return;
    sbc.rewardPacks.forEach(r=> addMyPacks(r.packId, r.count));
    addCoins(sbc.rewardCoins);
    const cardId = getSbcRewardCards()[sbc.id];
    if(cardId) addToCollection(cardId);
    const prog = getSbcProgress();
    prog['_claimed_'+sbc.id] = true;
    saveSbcProgress(prog);
    state.claimingSbcId = sbcId;
    state.sbcClaimStage = 'revealing';
    render();
  },
  exitSbcClaim(){
    state.claimingSbcId = null;
    state.sbcClaimStage = null;
    render();
  }
};

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
