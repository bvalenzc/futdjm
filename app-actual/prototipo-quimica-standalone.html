<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJM · Química</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --gold:#b5922e; --gold-light:#e8c565; --gold-deep:#6e5717; --red:#93202b; --red-light:#cf7982; --red-deep:#4a0d13; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#0a0908;color:#efe9d7;font-family:'Inter',sans-serif;min-height:100vh;}
body{background:radial-gradient(ellipse 80% 40% at 50% 0%, rgba(232,197,101,.12), transparent 60%), linear-gradient(175deg,#141109,#0a0908 60%);}
.wrap{max-width:900px;margin:0 auto;padding:30px 16px 90px;}
.eyebrow{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-light);text-align:center;font-weight:700;opacity:.85;}
h1{font-family:'Playfair Display',serif;text-align:center;font-size:clamp(22px,5vw,30px);margin:6px 0 0;font-weight:800;color:#f5f1e4;}
h1 em{font-style:normal;background:linear-gradient(180deg,var(--gold-light),var(--gold) 55%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}
.gold-rule{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto 8px;}
.hint{text-align:center;color:#a89a76;font-size:12px;max-width:420px;margin:0 auto 26px;line-height:1.5;}

/* química meter */
.chem-panel{max-width:340px;margin:0 auto 34px;background:linear-gradient(135deg,#1d1710,#0a0908);border:1px solid rgba(232,197,101,.3);border-radius:12px;padding:16px 18px;text-align:center;}
.chem-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#a89a76;font-weight:700;}
.chem-value{font-family:'Anton',sans-serif;font-size:34px;color:var(--gold-light);line-height:1.1;margin:2px 0 8px;}
.chem-bar{height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;}
.chem-fill{height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold-light));transition:width .35s ease;}

.section-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8a7c5c;font-weight:700;margin:30px 4px 14px;}
.row{display:flex;flex-wrap:wrap;gap:22px 30px;justify-content:center;}

/* ===== card, same VII Ideal shape ===== */
.fc-outer{
  width:104px;aspect-ratio:0.72;
  clip-path:polygon(50% 0%,88% 6%,100% 20%,100% 92%,90% 100%,10% 100%,0% 92%,0% 20%,12% 6%);
  padding:3px;position:relative;cursor:pointer;
  background:linear-gradient(160deg,#3a3427,#151109 75%);
  transition:transform .16s ease, filter .16s ease, opacity .16s ease;
}
.fc-outer.dimmed{opacity:.38;filter:grayscale(.4);}
.fc-outer.selected{
  transform:translateY(-6px) scale(1.04);
  filter:drop-shadow(0 0 0 2px var(--gold-light)) drop-shadow(0 10px 18px rgba(0,0,0,.55));
}
.fc-inner{
  clip-path:polygon(50% 0%,88% 6%,100% 20%,100% 92%,90% 100%,10% 100%,0% 92%,0% 20%,12% 6%);
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding:9% 6% 6%;
  text-align:center;position:relative;
}
.fc-inner::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(125deg, rgba(255,255,255,.16) 0 2px, transparent 2px 11px);mix-blend-mode:overlay;opacity:.7;}
.fc-inner::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 55% at 50% 0%, rgba(255,255,255,.30), transparent 62%), linear-gradient(0deg, rgba(0,0,0,.18), transparent 30%);}
.selected .fc-inner::after{background:radial-gradient(130% 55% at 50% 0%, rgba(255,255,255,.20), transparent 55%), linear-gradient(0deg, rgba(0,0,0,.42), rgba(0,0,0,.12) 40%);}
.fc-inner > *{position:relative;z-index:2;}
.fc-rating{font-family:'Playfair Display',serif;font-weight:800;font-size:14px;line-height:1;margin-bottom:2px;}
.fc-photo{width:54%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#2c2a22;margin-bottom:6%;border:1.5px solid rgba(255,255,255,.45);flex-shrink:0;}
.fc-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.fc-name{font-family:'Playfair Display',serif;font-weight:700;font-size:11px;line-height:1.15;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95%;}
.fc-pos{font-size:8px;letter-spacing:1px;text-transform:uppercase;opacity:.9;}

.pos-badge{
  position:absolute;right:-11px;top:40px;z-index:6;
  background:linear-gradient(160deg,#2b2b2b,#080808);
  color:var(--gold-light);font-family:'Playfair Display',serif;font-weight:700;font-size:8px;letter-spacing:.3px;
  padding:4px 6px 4px 8px;line-height:1.3;text-align:left;
  clip-path:polygon(16% 0%,100% 0%,100% 100%,16% 100%,0% 50%);
  box-shadow:0 3px 9px rgba(0,0,0,.45);
}

.chem-chip{
  position:absolute;left:-9px;top:-9px;z-index:7;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:10.5px;
  box-shadow:0 3px 7px rgba(0,0,0,.5),0 0 0 2px #0a0908;
}
.chem-chip.on{background:linear-gradient(160deg,var(--gold-light),var(--gold));color:#1c1600;}
.chem-chip.off{background:linear-gradient(160deg,#5a5a5a,#2a2a2a);color:#cfcfcf;}

.fc-inner.tier-plata{background:linear-gradient(160deg,#9aa1ab,#c3c8cf 45%,#eef0f2);color:#20232a;}
.tier-plata .fc-name{color:#141619;}
.fc-inner.tier-oro{background:linear-gradient(160deg,var(--gold-deep),var(--gold) 45%,var(--gold-light));color:#2c1a00;}
.tier-oro .fc-name{color:#241300;}
.fc-inner.tier-ororaro{background:linear-gradient(160deg,#7a4508,#e2a223 45%,#fff0b8);color:#2c1a00;}
.tier-ororaro .fc-name{color:#241300;}
.fc-inner.tier-if{background:linear-gradient(160deg,#1c1030,#6a4fae 45%,#c9a8ff);color:#f4ecff;}
.tier-if .fc-name{color:#fff;}
.fc-inner.tier-mvp{background:linear-gradient(160deg,#210a02,#a8330f 42%,#ff8f4a 80%,#ffcf8a);color:#fff4ea;}
.tier-mvp .fc-name{color:#fff;}
.fc-inner.tier-toty{background:linear-gradient(160deg,#4d7295,#a9c9e0 45%,#eaf4fb);color:#122335;}
.tier-toty .fc-name{color:#0c1a26;}
.fc-inner.tier-shapeshifter{background:linear-gradient(135deg,#ffd36e,#38e1c6 40%,#7b5cff 75%,#ff6fae);color:#fff;}
.tier-shapeshifter .fc-name{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);}
.fc-inner.tier-futurestar{background:linear-gradient(160deg,#03211d,#1f9b7f 45%,#9dffe0);color:#eafff8;}
.tier-futurestar .fc-name{color:#fff;}
.fc-inner.tier-icono{background:linear-gradient(160deg,var(--gold-deep) 2%,#f7efd9 30%,#fffef9 65%,#ffffff 100%);color:#3a2c05;}
.tier-icono .fc-name{font-weight:800;color:#2c2005;}
.fc-inner.tier-parche{background:linear-gradient(160deg,var(--red-deep),var(--red) 55%,var(--red-light));color:#fff4f2;}
.tier-parche .fc-name{color:#fff;}

.slot{display:flex;flex-direction:column;align-items:center;position:relative;}
.slot .cap{margin-top:8px;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#8a7c5c;font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Prototipo de mecánica · Don Julio de Milán</div>
  <h1>Química <em>DJM</em></h1>
  <div class="gold-rule"></div>
  <p class="hint">Tocá una carta para seleccionarla, tocá otra para cambiarlas de lugar. Si un jugador queda en una posición que no tiene, no aporta química.</p>

  <div class="chem-panel">
    <div class="chem-label">Química del equipo</div>
    <div class="chem-value" id="chemValue">–</div>
    <div class="chem-bar"><div class="chem-fill" id="chemFill"></div></div>
  </div>

  <div class="section-title">Titulares</div>
  <div class="row" id="startersRow"></div>

  <div class="section-title">Suplentes</div>
  <div class="row" id="benchRow"></div>
</div>

/* jugadores: positions = todas las posiciones válidas del jugador */
const PLAYERS = {
  p1:{name:'Pelao Izq', rating:92, tier:'icono', positions:['POR']},
  p2:{name:'Chelo', rating:86, tier:'mvp', positions:['DEF']},
  p3:{name:'Bañados', rating:74, tier:'plata', positions:['DEF','MC']},
  p4:{name:'Lucho', rating:89, tier:'if', positions:['MC']},
  p5:{name:'Valenz', rating:87, tier:'ororaro', positions:['MC']},
  p6:{name:'Rafa', rating:78, tier:'oro', positions:['MC']},
  p7:{name:'Vanti', rating:94, tier:'toty', positions:['DEL']},
  s1:{name:'Mau', rating:83, tier:'shapeshifter', positions:['DEF','MC','DEL']},
  s2:{name:'Costas', rating:79, tier:'futurestar', positions:['POR']},
  s3:{name:'Puente', rating:77, tier:'parche', positions:['MC']}
};

/* formación 1-3-2-1: 7 slots con posición requerida */
let starterSlots = [
  {role:'POR', playerId:'p1'},
  {role:'DEF', playerId:'p2'},
  {role:'DEF', playerId:'p3'},
  {role:'DEF', playerId:'p4'}, // Lucho arrancará fuera de posición a propósito, para mostrar el 0
  {role:'MC',  playerId:'p5'},
  {role:'MC',  playerId:'p6'},
  {role:'DEL', playerId:'p7'}
];
let bench = ['s1','s2','s3'];

let selected = null; // {kind:'starter'|'bench', index}

function hasChemistry(playerId, role){
  return PLAYERS[playerId].positions.includes(role);
}

function cardHtml(playerId, role, kind, index, chemistry){
  const p = PLAYERS[playerId];
  const isSel = selected && selected.kind===kind && selected.index===index;
  const dimmed = selected && !isSel;
  const badgeList = kind==='starter' ? p.positions.filter(pos=>pos!==role) : p.positions;
  const chemChip = kind==='starter'
    ? '<div class="chem-chip '+(chemistry?'on':'off')+'">'+(chemistry?'+10':'0')+'</div>'
    : '';
  const badge = badgeList.length ? '<div class="pos-badge">'+badgeList.join('<br>')+'</div>' : '';
  return '<div class="slot">'+
    '<div class="fc-outer '+(isSel?'selected':'')+' '+(dimmed?'dimmed':'')+'" data-kind="'+kind+'" data-index="'+index+'">'+
      '<div class="fc-inner tier-'+p.tier+'">'+
        '<div class="fc-rating">'+p.rating+'</div>'+
        '<div class="fc-photo"><img src="'+PHOTO_DATA+'"></div>'+
        '<div class="fc-name">'+p.name+'</div>'+
        '<div class="fc-pos">'+role+'</div>'+
      '</div>'+
    '</div>'+
    chemChip+
    badge+
    '<div class="cap">'+role+'</div>'+
  '</div>';
}

function render(){
  const startersRow = document.getElementById('startersRow');
  const benchRow = document.getElementById('benchRow');

  startersRow.innerHTML = starterSlots.map((s,i)=>cardHtml(s.playerId, s.role, 'starter', i, hasChemistry(s.playerId, s.role))).join('');
  benchRow.innerHTML = bench.map((pid,i)=>cardHtml(pid, PLAYERS[pid].positions[0], 'bench', i, false)).join('');

  const total = starterSlots.reduce((sum,s)=> sum + (hasChemistry(s.playerId, s.role) ? 10 : 0), 0);
  document.getElementById('chemValue').textContent = total + ' / 70';
  document.getElementById('chemFill').style.width = (total/70*100) + '%';

  document.querySelectorAll('.fc-outer').forEach(el=>{
    el.addEventListener('click', onCardClick);
  });
}

function onCardClick(e){
  const kind = e.currentTarget.getAttribute('data-kind');
  const index = parseInt(e.currentTarget.getAttribute('data-index'), 10);

  if(!selected){
    selected = {kind, index};
    render();
    return;
  }
  if(selected.kind===kind && selected.index===index){
    selected = null;
    render();
    return;
  }

  // swap
  const a = selected, b = {kind, index};
  const getPid = (ref)=> ref.kind==='starter' ? starterSlots[ref.index].playerId : bench[ref.index];
  const setPid = (ref, pid)=>{ if(ref.kind==='starter') starterSlots[ref.index].playerId = pid; else bench[ref.index] = pid; };

  const pidA = getPid(a), pidB = getPid(b);
  setPid(a, pidB);
  setPid(b, pidA);

  selected = null;
  render();
}

render();
</script>
